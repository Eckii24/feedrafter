# Private VPN/network only: this app has no user authentication. Do not expose publicly.
services:
  app:
    image: feedrafter:local
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to an external PostgreSQL database}
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact external browser origin}
      HOST: 0.0.0.0
      PORT: "3000"
      # Disabled until the deployed Karakeep response contract is independently verified.
      KARAKEEP_ENABLED: ${KARAKEEP_ENABLED:-false}
      KARAKEEP_BASE_URL: ${KARAKEEP_BASE_URL:-}
      KARAKEEP_TOKEN_FILE: ${KARAKEEP_TOKEN_FILE:-/data/karakeep-token}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
    volumes:
      - type: bind
        source: ${APP_DATA_DIR:?Set APP_DATA_DIR to a private persistent directory}
        target: /data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 40s
